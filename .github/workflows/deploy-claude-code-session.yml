name: Deploy Claude Code session to Pages

on:
  push:
    branches:
      - main
    paths:
      - "sessions/2026-07-29-ClaudeCodeforAppliedSocialScience/index.html"
      - "sessions/2026-07-29-ClaudeCodeforAppliedSocialScience/claude-code-guide.html"
      - ".github/workflows/deploy-claude-code-session.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy selected session
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble selective site
        shell: bash
        run: |
          session_path="sessions/2026-07-29-ClaudeCodeforAppliedSocialScience"
          site_path="_site/${session_path}"

          mkdir -p "${site_path}"

          cp "${session_path}/index.html" \
             "${site_path}/index.html"

          cp "${session_path}/claude-code-guide.html" \
             "${site_path}/claude-code-guide.html"

          touch "_site/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
